name: ci
on:
  push:
  pull_request:
  # manual trigger for the diag-resume causal stress matrix (A/B/C/D arms); no inputs needed,
  # the arms are the job matrix. Push/PR runs keep the unloaded control only.
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff tokenizers numpy pytest scipy detect-secrets transformers
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: ruff check --select E9,F train.py sft.py sft_math.py eval scripts datagen algorithms filters
      - run: python -m py_compile train.py sft.py sft_math.py serve.py chat.py infer.py datagen/prepare_sft_math.py eval/*.py scripts/*.py mathbank/*.py datagen/*.py algorithms/*.py filters/*.py
      - run: python scripts/test_arch_compat.py
      - run: python scripts/de109/check_cpu_parity.py
      # v41f faithful-repro suites, CPU-only. Each runner glob-discovers every
      # tests/v41f/test_p{0,1}_*.py module test; neither hard-requires CUDA. They are the
      # path-level gate for v41f/ production edits (the pre-commit hook selects them on any
      # staged v41f/*.py); CI runs them unconditionally so a red assertion on main cannot hide
      # behind a commit that did not stage the tests.
      - run: python tests/v41f/p0_selftest.py
      - run: python tests/v41f/p1_selftest.py
      # The assembly key/dtype gate exposes gate_* functions, not test_* ones, so the p1
      # glob runner loads it without executing it. Run it explicitly: it is the armed A/B
      # wiring gate (an implemented section that fails to arm exits nonzero).
      - run: python tests/v41f/test_p1_assembly_keys.py --selftest
      - run: python tests/v41f/test_p1_indexer_freeze.py --selftest
      # Engram ON config gate (de): a bare V41FConfig() must not validate. Runs here as well
      # as in the hook because the defect it guards is cheap to reintroduce by editing a
      # default, and the failure it prevents surfaces only at model build. Redundant on
      # purpose once #514 lands `harness.py ci-selftests` (which enumerates the hook's map
      # instead of re-listing it), and kept anyway: a few seconds of double-run is cheaper
      # than making a production-blocker fix wait on a CI refactor's merge order.
      - run: python tests/v41f/test_p1_config_gate.py --selftest
      - run: python tests/v41f/test_p1_train_ckpt.py
      # Step-D long-horizon numeric hygiene: off+ste at 40 steps, separate processes, with
      # frozen/SIX/finite/descent assertions and in-process mutants (~2-4 min CPU). The full
      # 160-step evidence is runs/longrun/*.json, too slow for CI; --selftest is the gate.
      - run: python probes/v41f_stepd_longrun.py --selftest
      # Cheap guard for the committed 160-step evidence JSONs (no model): the same validate()
      # over runs/longrun/, so a tampered/stale evidence file cannot sit there unchecked.
      - run: python probes/v41f_stepd_longrun.py --validate-committed runs/longrun
      # Non-blocking bimodal-resume diagnostic (0e): this selftest stays in the required
      # check job so the diagnostic's comparator is proven non-empty; the heavy multi-run
      # capture lives in the separate diag-resume job below (continue-on-error). It does NOT
      # replace or relax gate_resume_equivalent_to_uninterrupted above, which stays fail-closed.
      - run: python tests/v41f/diag_resume_bimodal.py --diag-selftest
      # Whole-machine train->save->fresh-process resume smoke (0e): bit-exact checkpoint at
      # load and a single-threaded 1-step bit-exact continuation (cross-platform). Heavy x3
      # model build runs here; the pre-commit hook runs the model-free --selftest.
      - run: python tests/v41f/test_p1_train_resume_smoke.py
      - run: python scripts/shape_audit.py --selftest
      - run: python scripts/shape_audit.py
      - run: python scripts/pod_drift.py --selftest
      - run: python scripts/loader.py selftest
      - run: python scripts/test_sft_pack.py
      - run: python scripts/test_eval_base_prompt_format.py --selftest
      - run: python scripts/test_fewshot_demos.py
      - run: python scripts/test_fewshot_stop.py
      - run: python scripts/test_pod_ps_judge.py
      # Both directions of sft_math.py's unstamped-pack refusal, by running the real script.
      # The holdout gate now sits ABOVE the checkpoint load, so these cases read the
      # gate's own wording; the corrupt-checkpoint case reds if that order is reversed.
      - run: python scripts/test_sft_holdout_gate.py
      - run: python scripts/test_attest_cases.py
      - run: python scripts/test_score_matrix_failpath.py
      - run: python scripts/test_free_card.py
      - run: python scripts/test_score_exit.py
      - run: python scripts/launch_tests.py --selftest
      - run: python scripts/test_artifact_path_ckpt.py
      - run: python scripts/test_ckpt_name_hyphen.py
      - run: python scripts/test_cursor_sum.py
      - run: python eval/cache_guard.py --selftest
      - run: python algorithms/test_rlvr_reward_suite.py
      # A shell test, so the hook cannot gate it: the hook runs every gated file through
      # sys.executable and `python foo.sh` dies on `set -euo pipefail`. CI is where it can
      # actually run. A de-5 DELETABLE candidate that passes and asserts a live property --
      # 0.4s, no data, no card: eval_math.sh/eval_code.sh refuse a bare rescore, allow
      # FORCE=1 and RUN=<name>, and version their shards before merging (fb's ruling,
      # 2026-09-02: run it before judging it).
      - run: bash scripts/test_eval_rescore.sh
      - run: python scripts/eqcheck.py
      # --check, not the bare call: the bare call REGENERATES, and d2c95b1c correctly made that
      # refuse where any registry path is absent -- a runner holds 5 of 13, so it can only write a
      # fingerprint no other machine reproduces. Regenerating is a deliberate act on the pod.
      #
      # --check asserts three things here, none of which regenerate anything: the committed guard
      # LOADS and is non-empty; its fingerprint matches the file list REGISTRY declares, derived
      # from REGISTRY_SHA1 so it holds on a runner missing 8 files; and every file present hashes
      # as recorded, with the absent ones NAMED as not checkable rather than counted as verified.
      # HOLDOUT_ALLOW_PARTIAL must stay out of CI -- it writes a knowingly partial guard, which is
      # the opposite of verifying one.
      - run: python datagen/holdout.py --check
      - run: python datagen/holdout.py --selftest
      # The seeds-guard check. It builds its own fixtures, so it covers the guard fully
      # here too -- CI has no ~/aupai-keep, and the first version gated its strongest
      # cases behind that file's existence, so CI ran one case while the summary named
      # four and a mutation of the hash check stayed green. Any machine without the real
      # seeds now reports them as an explicit SKIP, never as a case that ran.
      - run: python datagen/gen_textbooks.py --selftest
      - run: python scripts/tokenizer_report.py --selftest
      - run: python scripts/tokenizer_eval.py --selftest
      - run: python scripts/harness.py --selftest
      - run: python scripts/harness.py check
      # Every registered, CI-runnable selftest, enumerated from the hook's SELFTEST_FILES/PARTIAL
      # map at runtime rather than re-listed here. Closes the gap where a map selftest sat red for
      # days because nothing in this explicit list ran it (#502). NEEDS_DATA exemptions and the
      # small reasoned CI_SELFTEST_EXCLUDE set (GPU/gitignored-data/root) are partitioned out by
      # the ci_selftest_partition check; a newly registered portable selftest is covered without
      # anyone editing this file.
      - run: python scripts/harness.py ci-selftests --timeout 300
      # scripts/test_e2e.py is deliberately NOT here. It needs a GPU (KDA is fla/Triton
      # only), so on a runner it could only re-check the mix and the vocabulary that the
      # two steps above already cover, and exit 0 -- a green that means nothing. The chain
      # is covered by `E2E_GPU=<idx> python scripts/test_e2e.py` on the pod, and nowhere else.

  # DIAGNOSTIC ONLY, not a fix and never a gate. Investigates the runner-only red of
  # gate_resume_equivalent_to_uninterrupted (byte-identical 1.334e-2/506533/first0 on red runs;
  # clean physical host 14/14 green). The thread/oneDNN/load hypotheses were ALL falsified
  # (2026-09-19): workers are seeded and seeded threads=1/2 are bit-identical across processes
  # (0/524288); a 4-arm load x threads x oneDNN matrix was 24/24 green with load demonstrably
  # active. An earlier 99.9%-gradient-difference "reproduction" was an unseeded-model-init
  # artifact. Working hypothesis is a real control vs save/load-restart asymmetry (name-keyed
  # optim rebind / exp_avg / exp_avg_sq / step / serialization), pending de's spec. This job is
  # a passive instrument that compares the REAL gate against the diag as symmetric sibling
  # children; push runs an unloaded co-located control, manual workflow_dispatch runs the 4-arm
  # matrix. Burners are outer siblings, never in the test process; threads=1 / oneDNN-off are
  # diagnostic arms, not a gate fix. The required check job above keeps the real gate
  # fail-closed; this job exits 0 by construction.
  diag-resume:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arm: "A_idle_t2",       stress: "0", gate_omp: "2", onednn: "" }
          - { arm: "B_load_t2",       stress: "4", gate_omp: "2", onednn: "" }
          - { arm: "C_load_t2_nodnn", stress: "4", gate_omp: "2", onednn: "0" }
          - { arm: "D_load_t1",       stress: "4", gate_omp: "1", onednn: "" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python tests/v41f/diag_resume_bimodal.py --diag-selftest
      - name: unloaded co-located control (push; 8 pairs)
        if: github.event_name != 'workflow_dispatch'
        run: python tests/v41f/diag_resume_bimodal.py --diag-colocate 8
      - name: "causal arm ${{ matrix.arm }}: 6 co-located pairs, stress=${{ matrix.stress }}"
        if: github.event_name == 'workflow_dispatch'
        env:
          GATE_OMP: "${{ matrix.gate_omp }}"
          GATE_ONEDNN: "${{ matrix.onednn }}"
        run: python tests/v41f/diag_resume_bimodal.py --diag-colocate 6 --stress "${{ matrix.stress }}"
