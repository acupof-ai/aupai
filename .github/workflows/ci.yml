name: ci
on:
  push:
  pull_request:
# One in-flight run per (ref, event); a newer run cancels the older one's in-progress jobs,
# EXCEPT a push to main: main runs are the tree every branch starts from, and the 2026-09-24
# CI split made each push cheaper but also more frequent -- cancelling one mid-flight leaves
# its tip with no completed verdict, and merge_main reads `cancelled` as a refuse state. Main
# pushes now run to completion and queue; PR/branch pushes keep latest-wins (the backlog that
# motivated cancellation was branch pushes, measured 2026-09-20: 32 queued / 3 in progress).
#
# THE EVENT IS IN THE GROUP, and that is load-bearing rather than tidy. `merge_main.sh:467`
# refuses every ledger merge while main's newest PUSH run reads `cancelled` ("every branch
# starts from that tree"), and `_main_ci_is_red` selects push runs only (`--event push`).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
jobs:
  # Fast static + script checks. Kept separate from the heavy model-building jobs so this
  # reports first; ruff/py_compile failures no longer wait behind a 200s torch install.
  check-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # cache-dependency-path is the workflow itself: the install set is the two pip lines
      # below, so a bump there invalidates the cache and anything else keeps it.
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: ".github/workflows/ci.yml" }
      - run: pip install ruff tokenizers numpy pytest scipy detect-secrets transformers
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: ruff check --select E9,F train.py sft.py sft_math.py eval scripts datagen algorithms filters
      - run: python -m py_compile train.py sft.py sft_math.py serve.py chat.py infer.py datagen/prepare_sft_math.py eval/*.py scripts/*.py mathbank/*.py datagen/*.py algorithms/*.py filters/*.py
      - run: python scripts/test_arch_compat.py
      # CED divergence watchdog known-answer layer (parse/decide + NUL-cmdline matcher).
      # The real seg1-log fire/silent kata is pod-only; this pins the pure layer on every push.
      - run: python scripts/test_ced_diverge_watch.py --selftest
      # CED resume-continuity through the REAL train.py loop (~1 min, four CPU segments): a
      # save_every ckpt's weights/optimizer/AdamW-step agree with its named step, resume is
      # bit-exact vs an uninterrupted run, and the row cursor neither skips nor repeats; the
      # 500-mod-1000 snapshot-skew defect is pinned by an in-test two-cadence mutant. The
      # commit hook runs only this file's model-free --selftest; this is the heavy half.
      - name: CED resume-continuity gate
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_DYNAMIC: "FALSE"
        run: python scripts/test_ced_resume_cpu.py
      # CED code-SFT smoke through the REAL sft_math.py loop (~1 min CPU): a d512/L4 CED+MoE
      # ckpt + a real-schema pack runs 24 steps with the user-ordered linear schedule, loss
      # decreases, every batch masks prompt and supervises eos, kind="sft" and the
      # epoch1/epoch2 boundary saves are correct. The commit hook runs only its model-free
      # --selftest; this is the heavy half.
      - name: CED code-SFT smoke
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_DYNAMIC: "FALSE"
        run: python scripts/test_sft_ced_cpu.py
      - run: python scripts/de109/check_cpu_parity.py
      # Muon Newton-Schulz rank sharding bit-parity: gloo world2/world4 CPU, sharded NS must
      # equal one rank doing every stacked instance, plus the uneven-group fallback.
      - name: Muon NS shard bit-parity
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_DYNAMIC: "FALSE"
        run: python scripts/test_muon_ns_shard.py
      - run: python scripts/shape_audit.py --selftest
      - run: python scripts/shape_audit.py
      - run: python scripts/pod_drift.py --selftest
      - run: python scripts/loader.py selftest
      - run: python scripts/test_sft_pack.py
      - run: python scripts/test_eval_base_prompt_format.py --selftest
      - run: python scripts/test_fewshot_demos.py
      - run: python scripts/test_fewshot_stop.py
      - run: python scripts/test_pod_ps_judge.py
      # Both directions of sft_math.py's unstamped-pack refusal, by running the real script.
      # The holdout gate now sits ABOVE the checkpoint load, so these cases read the
      # gate's own wording; the corrupt-checkpoint case reds if that order is reversed.
      - run: python scripts/test_sft_holdout_gate.py
      - run: python scripts/test_attest_cases.py
      - run: python scripts/test_score_matrix_failpath.py
      - run: python scripts/test_free_card.py
      - run: python scripts/test_score_exit.py
      - run: python scripts/launch_tests.py --selftest
      - run: python scripts/test_artifact_path_ckpt.py
      - run: python scripts/test_ckpt_name_hyphen.py
      - run: python scripts/test_cursor_sum.py
      - run: python eval/cache_guard.py --selftest
      - run: python algorithms/test_rlvr_reward_suite.py
      # A shell test, so the hook cannot gate it: the hook runs every gated file through
      # sys.executable and `python foo.sh` dies on `set -euo pipefail`. CI is where it can
      # actually run. A de-5 DELETABLE candidate that passes and asserts a live property --
      # 0.4s, no data, no card: eval_math.sh/eval_code.sh refuse a bare rescore, allow
      # FORCE=1 and RUN=<name>, and version their shards before merging (fb's ruling,
      # 2026-09-02: run it before judging it).
      - run: bash scripts/test_eval_rescore.sh
      - run: python scripts/eqcheck.py
      # --check, not the bare call: the bare call REGENERATES, and d2c95b1c correctly made that
      # refuse where any registry path is absent -- a runner holds 5 of 13, so it can only write a
      # fingerprint no other machine reproduces. Regenerating is a deliberate act on the pod.
      #
      # --check asserts three things here, none of which regenerate anything: the committed guard
      # LOADS and is non-empty; its fingerprint matches the file list REGISTRY declares, derived
      # from REGISTRY_SHA1 so it holds on a runner missing 8 files; and every file present hashes
      # as recorded, with the absent ones NAMED as not checkable rather than counted as verified.
      # HOLDOUT_ALLOW_PARTIAL must stay out of CI -- it writes a knowingly partial guard, which is
      # the opposite of verifying one.
      - run: python datagen/holdout.py --check
      - run: python datagen/holdout.py --selftest
      # The seeds-guard check. It builds its own fixtures, so it covers the guard fully
      # here too -- CI has no ~/aupai-keep, and the first version gated its strongest
      # cases behind that file's existence, so CI ran one case while the summary named
      # four and a mutation of the hash check stayed green. Any machine without the real
      # seeds now reports them as an explicit SKIP, never as a case that ran.
      - run: python datagen/gen_textbooks.py --selftest
      - run: python scripts/tokenizer_report.py --selftest
      - run: python scripts/tokenizer_eval.py --selftest
      - run: python scripts/harness.py check

  # `harness --selftest` alone: every check's broken-world suite. Measured at ~500s on
  # 2026-09-24 (run 35992833222), it was the single longest serial step; isolating it lets
  # the other four jobs run alongside instead of behind it.
  check-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: ".github/workflows/ci.yml" }
      - run: pip install ruff tokenizers numpy pytest scipy detect-secrets transformers
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/harness.py --selftest

  # Every registered, CI-runnable selftest, enumerated from the hook's SELFTEST_FILES/PARTIAL
  # map at runtime rather than re-listed here, split over a 3-way matrix. Each entry runs
  # `harness ci-selftests --shard K/3`: the shard contents are LPT-packed (longest first
  # onto the lightest shard) against the committed scripts/ci_selftest_timings.json, which
  # balances the measured 924s at 308.2/308.2/308.2s -- a round-robin slice cut the same set
  # 795/231 because the slow targets cluster. check_ci_selftest_partition asserts the three
  # declared shards union back to the EXACT driver bucket (no dropped/duplicated target) and
  # the timing table keys equal that bucket, so a matrix edit or a stale table is red.
  # NEEDS_DATA exemptions and the small reasoned CI_SELFTEST_EXCLUDE set stay partitioned out
  # by that check; a newly registered portable selftest enters the packing without anyone
  # editing this file (it gets weight 1 until the table is regenerated).
  ci-selftests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: ".github/workflows/ci.yml" }
      - run: pip install ruff tokenizers numpy pytest scipy detect-secrets transformers
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # bubblewrap so the code-RL reward selftests (algorithms/test_rl_code.py) execute
      # model rollouts under REAL isolation on the runner. Two hosted-runner obstacles,
      # both measured on this PR:
      #  1. bwrap may be absent -> apt install it.
      #  2. Ubuntu 24.04 ships kernel.apparmor_restrict_unprivileged_userns=1, so a
      #     non-root bwrap dies with "setting up uid map: Permission denied" (and before
      #     that, with netns, RTM_NEWADDR). The VM grants sudo; relax that sysctl so the
      #     unprivileged user namespace works. isolate.py also binds /opt (the
      #     hostedtoolcache python) and falls back to --share-net when netns is unavailable.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-all --ro-bind /usr /usr --ro-bind-try /lib /lib \
            --ro-bind-try /lib64 /lib64 --ro-bind-try /bin /bin -- true
      # CI is trusted infra and only runs the committed known-answer reward tests; the
      # default isolate.run() REFUSES a bwrap host without an isolated net namespace.
      # After the sysctl above the net probe should pass, but keep the explicit override so
      # an image that blocks the sysctl still runs the selftests and reports net=False.
      # The pod deliberately does NOT set this: RL-generated code never shares host net.
      - env:
          AUPAI_SANDBOX_ALLOW_SHARED_NET: "1"
        run: python scripts/harness.py ci-selftests --shard ${{ matrix.shard }}/3 --timeout 300
      # scripts/test_e2e.py is deliberately NOT here. It needs a GPU, so on a runner it could
      # only re-check the mix and the vocabulary that harness check already covers, and exit 0
      # -- a green that means nothing. It runs via `E2E_GPU=<idx> python scripts/test_e2e.py`
      # on the pod, and nowhere else.

